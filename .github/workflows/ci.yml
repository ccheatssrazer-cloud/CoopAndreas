name: Build CoopAndreas

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Plugin-SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git github_plugin_sdk
          mkdir -p github_plugin_sdk/output/lib
          # ВАЖНО: Если упадет на этапе линковки (LNK1104), 
          # значит в github_plugin_sdk/output/lib не хватает plugin.lib

      - name: Build Server and Proxy
        shell: bash
        run: |
          # Сборка без лишних флагов, чтобы enet (C) не ругался
          xmake f -a x86 -m release -y
          xmake build server
          xmake build proxy

      - name: Build Client (SA)
        shell: bash
        run: |
          export PLUGIN_SDK_DIR="$(pwd)/github_plugin_sdk"
          
          # Полная очистка предыдущего конфига
          xmake c -a
          
          # Конфиг специально для Клиента с лечением injector.hpp
          # Добавляем принудительные инклуды стандартных библиотек
          xmake f -a x86 -m release -y \
            --cxflags="/permissive- /FI type_traits /FI algorithm /FI functional /FI utility"
          
          xmake build client

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-Binaries
          path: |
            build/windows/x86/release/server.exe
            build/windows/x86/release/proxy.dll
            build/windows/x86/release/CoopAndreasSA.dll
          if-no-files-found: error
