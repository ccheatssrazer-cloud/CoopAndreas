name: Build CoopAndreas

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Plugin-SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git github_plugin_sdk
          mkdir -p github_plugin_sdk/output/lib

      - name: Build Projects
        shell: bash
        run: |
          export PLUGIN_SDK_DIR="$(pwd)/github_plugin_sdk"
          
          # 1. Чистая конфигурация под x86
          xmake f -a x86 -m release -y
          
          # 2. Сборка того, что уже работает
          xmake build server
          xmake build proxy
          
          # 3. Сборка клиента с "лекарством" через переменную окружения
          # Это заставит компилятор проглотить старый код SDK
          export XMAKE_CXFLAGS="/permissive- /FI type_traits /FI algorithm"
          xmake build -y client

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-Full-Package
          path: |
            build/windows/x86/release/server.exe
            build/windows/x86/release/proxy.dll
            build/windows/x86/release/CoopAndreasSA.dll
          if-no-files-found: error
