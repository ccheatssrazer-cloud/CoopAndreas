name: Build CoopAndreas

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Plugin-SDK
        shell: bash
        run: |
          # Клонируем SDK
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git github_plugin_sdk
          # Создаем структуру, чтобы линковка не упала сразу
          mkdir -p github_plugin_sdk/output/lib
          # ВАЖНО: Если билд упадет на линковке (LNK1104), тебе придется залить 
          # файл plugin.lib в свой репозиторий и подложить его сюда.

      - name: Build
        shell: bash
        run: |
          export PLUGIN_SDK_DIR=$(pwd)/github_plugin_sdk
          
          # Настройка билда:
          # 1. -a x86: Обязательно для GTA SA
          # 2. --cxflags: Добавляем /permissive- (лояльность к старому коду) 
          #    и /FI"type_traits" (принудительно лечит ошибку injector.hpp)
          xmake f -a x86 -m release -y \
            --cxflags="/permissive- /FI\"type_traits\" /FI\"algorithm\""
          
          xmake build server
          xmake build proxy
          xmake build client

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-Binaries
          path: |
            build/windows/x86/release/server.exe
            build/windows/x86/release/proxy.dll
            build/windows/x86/release/CoopAndreasSA.dll
          if-no-files-found: warn
          
