name: Build CoopAndreas

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Dependencies
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git github_plugin_sdk
        shell: bash

      - name: Build
        run: |
          # Установка путей для xmake.lua
          export PLUGIN_SDK_DIR=$(pwd)/github_plugin_sdk
          
          # Конфигурация и сборка
          xmake f -a x86 -m release -y
          xmake build client
          xmake build server
          xmake build proxy
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-Binaries
          path: |
            build/windows/x86/release/CoopAndreasSA.dll
            build/windows/x86/release/server.exe
            build/windows/x86/release/proxy.dll
          if-no-files-found: error
